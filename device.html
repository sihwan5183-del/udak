<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">

<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Pretendard Variable','Pretendard',-apple-system,sans-serif;background:#fff;color:#111;-webkit-tap-highlight-color:transparent;}
.dtopbar{position:sticky;top:0;background:#fff;border-bottom:1px solid #f0f0f0;padding:16px 20px;display:flex;align-items:center;gap:10px;z-index:10;}
.dtopbar-back{display:flex;align-items:center;gap:6px;font-size:14px;color:#666;font-weight:600;text-decoration:none;}
.dwrap{max-width:520px;margin:0 auto;padding:24px 20px 60px;}

.udetail-img{width:100%;aspect-ratio:1/1;border-radius:16px;background:#fff;border:1.5px solid #ececec;box-sizing:border-box;display:flex;align-items:center;justify-content:center;margin-bottom:20px;overflow:hidden;}
.udetail-img img{max-width:92%;max-height:92%;object-fit:contain;}
.udetail-name{font-size:22px;font-weight:800;color:#1A1A1A;margin:0 0 22px;text-align:center;}
.udetail-sec{margin-bottom:22px;}
.udetail-lbl{font-size:13px;color:#888;font-weight:700;margin:0 0 10px;}
.udetail-row{display:flex;gap:10px;flex-wrap:wrap;}
.ud-color{width:40px;height:40px;border-radius:50%;cursor:pointer;border:2px solid transparent;box-shadow:0 0 0 1px #ececec inset;}
.ud-color.on{border-color:#E91E8C;box-shadow:0 0 0 1px #E91E8C inset;}
.ud-chip{padding:12px 14px;border:1.5px solid #ddd;border-radius:10px;font-size:13.5px;font-weight:700;color:#555;cursor:pointer;background:#fff;text-align:center;flex:1;min-width:80px;}
.ud-chip.on{border-color:#E91E8C;color:#E91E8C;background:rgba(233,30,140,.06);}

.udetail-hero{background:rgba(233,30,140,.05);border:1px solid rgba(233,30,140,.15);border-radius:16px;padding:20px;margin-bottom:24px;}
.udetail-hero-lbl{font-size:12.5px;color:#888;font-weight:700;margin:0 0 6px;}
.udetail-hero-amt{font-size:30px;font-weight:800;color:#E91E8C;letter-spacing:-.02em;}
.udetail-hero-amt span{font-size:17px;font-weight:700;margin-left:2px;}
.udetail-hero-sub{font-size:12px;color:#999;margin:4px 0 0;}
.udetail-plan-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border:1.5px solid #ececec;border-radius:12px;cursor:pointer;}
.udetail-plan-row.open{border-radius:12px 12px 0 0;}
.udetail-plan-mid{font-size:14px;color:#1A1A1A;font-weight:800;margin-left:8px;}
.udetail-plan-right{display:flex;align-items:center;gap:6px;}
.udetail-plan-price{color:#E91E8C;font-weight:800;font-size:14px;}
.udetail-plan-arrow{font-size:10px;color:#bbb;transition:transform .2s;}
.udetail-plan-row.open .udetail-plan-arrow{transform:rotate(180deg);}
.udetail-plan-list{border:1.5px solid #ececec;border-top:none;border-radius:0 0 12px 12px;overflow:hidden;}
.udetail-plan-item{display:flex;justify-content:space-between;padding:12px 16px;font-size:13px;color:#666;cursor:pointer;border-top:1px solid #f2f2f2;}
.udetail-plan-item.on{background:rgba(233,30,140,.05);color:#E91E8C;font-weight:700;}
.udetail-discount-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.udetail-discount-card{border:1.5px solid #ececec;border-radius:12px;padding:12px 14px;cursor:pointer;position:relative;}
.udetail-discount-card.on{border-color:#E91E8C;background:rgba(233,30,140,.04);}
.udetail-discount-name{font-size:13.5px;font-weight:800;color:#1A1A1A;margin:0 0 4px;}
.udetail-discount-desc{font-size:11px;color:#888;line-height:1.5;}
.udetail-discount-check{position:absolute;top:10px;right:10px;width:16px;height:16px;border-radius:50%;background:#E91E8C;color:#fff;font-size:10px;display:none;align-items:center;justify-content:center;}
.udetail-discount-card.on .udetail-discount-check{display:flex;}
.udetail-breakdown2{background:#f9f9fb;border-radius:12px;padding:16px;}
.udb2-row{display:flex;align-items:center;gap:8px;font-size:13.5px;color:#666;padding:7px 0;}
.udb2-badge{width:18px;height:18px;border-radius:5px;background:#E91E8C;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.udb2-row b{margin-left:auto;color:#1A1A1A;font-weight:700;}
.udetail-benefit-row{display:flex;gap:8px;flex-wrap:wrap;}
.udetail-benefit-tag{flex:1;min-width:90px;text-align:center;padding:12px 8px;border:1.5px solid #ececec;border-radius:10px;font-size:12px;font-weight:700;color:#666;}
.udetail-btnrow2{display:flex;gap:10px;margin-top:8px;}
.udetail-btn-consult{flex:1;padding:16px;background:#fff;border:1.5px solid #E91E8C;border-radius:13px;color:#E91E8C;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;}
.udetail-btn-order{flex:1.3;padding:16px;background:#E91E8C;border:none;border-radius:13px;color:#fff;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;}
.dempty{text-align:center;padding:80px 20px;color:#999;font-size:14px;}
</style>
</head><body>

<script>
/* ── device.html: 기기 상세 전용 독립 페이지. galaxy_z8.html의 카탈로그 카드에서 실제 링크(a href)로 진입함 ── */
const UCAT_DB_URL='https://udak-c6832-default-rtdb.firebaseio.com';

const UCAT_Z8_DEVICES=[
  {id:'z-fold8',name:'갤럭시 Z 폴드8',img:'https://raw.githubusercontent.com/sihwan5183-del/udak/main/assets/product-wide-black-v2.png',
    storageList:[{name:'256GB',price:2277000}],
    colors:[{name:'#3A3A3C|그라파이트',img:'https://raw.githubusercontent.com/sihwan5183-del/udak/main/assets/product-wide-black-v2.png'},
            {name:'#F0E6D2|크림',img:'https://raw.githubusercontent.com/sihwan5183-del/udak/main/assets/product-wide-cream-v2.png'},
            {name:'#C9BFE0|라벤더',img:'https://raw.githubusercontent.com/sihwan5183-del/udak/main/assets/product-wide-lavender-v2.png'}]},
  {id:'z-fold8-ultra',name:'갤럭시 Z 폴드8 울트라',img:'https://raw.githubusercontent.com/sihwan5183-del/udak/main/assets/product-ultra-graphite-v2.png',
    storageList:[{name:'256GB',price:2577300}],
    colors:[{name:'#3A3A3C|그라파이트',img:'https://raw.githubusercontent.com/sihwan5183-del/udak/main/assets/product-ultra-graphite-v2.png'},
            {name:'#5C4E77|바이올렛 쉐도우',img:'https://raw.githubusercontent.com/sihwan5183-del/udak/main/assets/product-ultra-violet-v2.png'},
            {name:'#F0E6D2|크림',img:'https://raw.githubusercontent.com/sihwan5183-del/udak/main/assets/product-ultra-cream-v2.png'}]},
  {id:'z-flip8',name:'갤럭시 Z 플립8',img:'https://raw.githubusercontent.com/sihwan5183-del/udak/main/assets/product-flip-graphite-v2.png',
    storageList:[{name:'256GB',price:1683000}],
    colors:[{name:'#3A3A3C|그라파이트',img:'https://raw.githubusercontent.com/sihwan5183-del/udak/main/assets/product-flip-graphite-v2.png'},
            {name:'#F0E6D2|크림',img:'https://raw.githubusercontent.com/sihwan5183-del/udak/main/assets/product-flip-cream-v2.png'},
            {name:'#F2C6D6|핑크',img:'https://raw.githubusercontent.com/sihwan5183-del/udak/main/assets/product-flip-pink-v2.png'}]}
];
const UCAT_Z8_POLICIES=[
  {name:'Z8 기기변경(LGU+)',jointype:'기기변경',carrier:'LG U+',plangroup:'all',pubSupport:500000,rebate:300000,distribution:0,structure:0,extraPolicy:0,deviceOverrides:{},excludedDevs:[]},
  {name:'Z8 번호이동(타사)',jointype:'번호이동',carrier:'SKT,KT,알뜰폰',plangroup:'all',pubSupport:500000,rebate:500000,distribution:0,structure:0,extraPolicy:0,deviceOverrides:{'z-fold8':{rebate:450000}},excludedDevs:[]}
];
const UCAT_MDEV_FALLBACK=[
  {id:'s26',name:'갤럭시 S26',img:'',storageList:[{name:'256GB',price:1254000},{name:'512GB',price:1386000}],colors:[{name:'#4B5563|그라파이트',img:''},{name:'#C084FC|바이올렛',img:''},{name:'#F9A8D4|핑크골드',img:''}]},
  {id:'s26p',name:'갤럭시 S26+',img:'',storageList:[{name:'256GB',price:1452000},{name:'512GB',price:1584000}],colors:[{name:'#1E3A5F|네이비',img:''},{name:'#F5F5F5|화이트실버',img:''}]},
  {id:'s26u',name:'갤럭시 S26 울트라',img:'',storageList:[{name:'256GB',price:1797000},{name:'512GB',price:1929000},{name:'1TB',price:2178000}],colors:[{name:'#1C1C1C|티타늄블랙',img:''},{name:'#C0B090|티타늄화이트',img:''}]},
  {id:'ip17',name:'아이폰 17',img:'',storageList:[{name:'128GB',price:990000},{name:'256GB',price:1122000},{name:'512GB',price:1386000}],colors:[{name:'#FFFFFF|화이트',img:''},{name:'#000000|블랙',img:''},{name:'#FFB6C1|핑크',img:''}]},
  {id:'ip17p',name:'아이폰 17 Pro',img:'',storageList:[{name:'128GB',price:1290000},{name:'256GB',price:1422000},{name:'512GB',price:1686000},{name:'1TB',price:1950000}],colors:[{name:'#8E8E93|내추럴티타늄',img:''},{name:'#1C1C1E|블랙티타늄',img:''},{name:'#D4AF37|데저트티타늄',img:''}]},
  {id:'ip17pm',name:'아이폰 17 Pro Max',img:'',storageList:[{name:'256GB',price:1590000},{name:'512GB',price:1854000},{name:'1TB',price:2118000}],colors:[{name:'#8E8E93|내추럴티타늄',img:''},{name:'#1C1C1E|블랙티타늄',img:''},{name:'#D4AF37|데저트티타늄',img:''}]}
];

let ucatDevices=[...UCAT_Z8_DEVICES];
let ucatPolicies=[...UCAT_Z8_POLICIES];
let ucatPlans=[{plangroup:'85',monthlyPrice:85000,name:'5G 프리미어 에센셜'}];
let ucatSel={device:null,color:0,storage:0,carrier:'LG U+',plan:null,discountMethod:'pubSupport',planListOpen:false};

function ucatQuote(device,carrierName,jointype,planObj){
  if(!device) return null;
  const storage=device.storageList&&device.storageList[0];
  const lp=storage?storage.price:0;
  const pg=planObj?Math.floor(planObj.monthlyPrice/1000).toString():'85';
  const isZ8=(device.id||'').startsWith('z-');
  const searchPolicies=isZ8?UCAT_Z8_POLICIES:(ucatPolicies||[]);
  const fns=[
    p=>p.jointype===jointype&&p.carrier!=='all'&&p.carrier&&p.carrier.includes(carrierName)&&p.plangroup===pg,
    p=>p.jointype===jointype&&p.carrier==='all'&&p.plangroup===pg,
    p=>p.jointype==='all'&&p.carrier!=='all'&&p.carrier&&p.carrier.includes(carrierName)&&p.plangroup===pg,
    p=>p.jointype==='all'&&p.carrier==='all'&&p.plangroup===pg,
    p=>p.jointype===jointype&&p.carrier!=='all'&&p.carrier&&p.carrier.includes(carrierName)&&p.plangroup==='all',
    p=>p.jointype===jointype&&p.carrier==='all'&&p.plangroup==='all',
    p=>p.jointype==='all'&&p.carrier!=='all'&&p.carrier&&p.carrier.includes(carrierName)&&p.plangroup==='all',
    p=>p.jointype==='all'&&p.carrier==='all'&&p.plangroup==='all',
  ];
  let pol=null;
  for(const fn of fns){
    const f=searchPolicies.find(fn);
    if(f){
      if((f.excludedDevs||[]).includes(device.id)) continue;
      const rawOv=f.deviceOverrides&&f.deviceOverrides[device.id];
      if(rawOv){
        const storageName=storage?storage.name:null;
        const nested=storageName?rawOv[storageName]:null;
        const flat=(rawOv.pubSupport!=null||rawOv.rebate!=null)?rawOv:null;
        const ov=nested||flat;
        pol=ov?{...f,...ov}:f;
      } else pol=f;
      break;
    }
  }
  if(!pol) return null;
  const pub=pol.pubSupport||0;
  const extra=(pol.rebate||0)+(pol.distribution||0)+(pol.structure||0)+(pol.extraPolicy||0);
  return {price:lp, pub:pub, extra:extra, final:Math.max(0,lp-pub-extra)};
}

function renderPage(){
  const params=new URLSearchParams(window.location.search);
  const id=params.get('id');
  const d=ucatDevices.find(x=>x.id===id);
  if(!d){
    document.getElementById('dContent').innerHTML='<div class="dempty">기기를 찾을 수 없습니다.<br><a href="/galaxy_z8" style="color:#E91E8C;font-weight:700;">목록으로 돌아가기</a></div>';
    return;
  }
  ucatSel={device:d,color:0,storage:0,carrier:'LG U+',plan:(ucatPlans.find(p=>p.plangroup==='85')||ucatPlans[0]),discountMethod:'pubSupport',planListOpen:false};
  document.title=d.name+' — 유플러스 다이렉트';
  document.getElementById('dContent').innerHTML=`
    <div class="udetail-img" id="udImg"></div>
    <p class="udetail-name">${d.name}</p>
    <div class="udetail-hero">
      <p class="udetail-hero-lbl">예상 월 납부금액</p>
      <p class="udetail-hero-amt" id="udHeroAmt">-<span>원</span></p>
      <p class="udetail-hero-sub" id="udHeroSub">-</p>
    </div>
    <div class="udetail-sec"><p class="udetail-lbl">컬러</p><div class="udetail-row" id="udColors"></div></div>
    <div class="udetail-sec"><p class="udetail-lbl">용량</p><div class="udetail-row" id="udStorage"></div></div>
    <div class="udetail-sec"><p class="udetail-lbl">현재 사용 중인 통신사</p><div class="udetail-row" id="udCarrier"></div></div>
    <div class="udetail-sec"><p class="udetail-lbl">요금제</p><div id="udPlanWrap"></div></div>
    <div class="udetail-sec"><p class="udetail-lbl">할인방식</p><div class="udetail-discount-grid" id="udDiscount"></div></div>
    <div class="udetail-sec" id="udSubsidyWrap" style="display:none">
      <p class="udetail-lbl">지원금 상세</p>
      <div class="udetail-breakdown2">
        <div class="udb2-row"><span>출고가</span><b id="udbListPrice">-</b></div>
        <div class="udb2-row"><span>공시지원금</span><b id="udbPubAmt" style="color:#E91E8C;">-</b></div>
        <div class="udb2-row"><span>유플러스 다이렉트 혜택</span><b id="udbExtraAmt" style="color:#E91E8C;">-</b></div>
        <div class="udb2-row" style="border-top:1px dashed #ddd;margin-top:4px;padding-top:10px;"><span>남은 할부원금</span><b id="udbPrincipal">-</b></div>
      </div>
    </div>
    <div class="udetail-sec">
      <p class="udetail-lbl">월 납부금액 구성</p>
      <div class="udetail-breakdown2">
        <div class="udb2-row"><span class="udb2-badge">A</span><span>월 통신요금</span><span style="margin-left:auto;text-align:right;"><span id="udbFeeOrig" style="text-decoration:line-through;color:#bbb;font-size:11px;margin-right:5px;display:none;"></span><b id="udbFee">-</b></span></div>
        <div class="udb2-row"><span class="udb2-badge">B</span><span>월 할부금(24개월)</span><b id="udbDev">-</b></div>
      </div>
    </div>
    <div class="udetail-sec">
      <p class="udetail-lbl">🎁 추가 혜택</p>
      <div class="udetail-benefit-row">
        <div class="udetail-benefit-tag">📺 인터넷+TV</div>
        <div class="udetail-benefit-tag">💳 카드할인</div>
        <div class="udetail-benefit-tag">👨‍👩‍👧 결합할인</div>
      </div>
    </div>
    <div class="udetail-btnrow2">
      <button class="udetail-btn-consult" onclick="ctaGo()" type="button">상담 문의</button>
      <button class="udetail-btn-order" onclick="ctaGo()" type="button">주문 신청하기</button>
    </div>`;
  renderColors();renderStorage();renderCarrier();renderPlanRow();renderDiscount();
  refreshImg();refreshPrice();
}

function renderColors(){
  document.getElementById('udColors').innerHTML=(ucatSel.device.colors||[]).map((c,i)=>{
    const hx=c.name.split('|')[0];
    return`<span class="ud-color${ucatSel.color===i?' on':''}" style="background:${hx}" onclick="pickColor(${i})"></span>`;
  }).join('');
}
function renderStorage(){
  document.getElementById('udStorage').innerHTML=(ucatSel.device.storageList||[]).map((s,i)=>
    `<span class="ud-chip${ucatSel.storage===i?' on':''}" onclick="pickStorage(${i})">${s.name}</span>`).join('');
}
function renderCarrier(){
  const carriers=['SKT','KT','LG U+','알뜰폰'];
  document.getElementById('udCarrier').innerHTML=carriers.map(n=>
    `<span class="ud-chip${ucatSel.carrier===n?' on':''}" onclick="pickCarrier('${n}')">${n}</span>`).join('');
}
function renderPlanRow(){
  const open=ucatSel.planListOpen;
  document.getElementById('udPlanWrap').innerHTML=`<div class="udetail-plan-row${open?' open':''}" onclick="togglePlanList()">
    <div><span class="udetail-plan-mid">${ucatSel.plan?ucatSel.plan.name:'-'}</span></div>
    <div class="udetail-plan-right"><span class="udetail-plan-price">월 ${(ucatSel.plan?ucatSel.plan.monthlyPrice:0).toLocaleString()}원</span><span class="udetail-plan-arrow">▾</span></div>
  </div>
  ${open?`<div class="udetail-plan-list">${ucatPlans.map((p,i)=>`<div class="udetail-plan-item${ucatSel.plan&&ucatSel.plan.plangroup===p.plangroup?' on':''}" onclick="pickPlan(${i})"><span>${p.name}</span><b>월 ${p.monthlyPrice.toLocaleString()}원</b></div>`).join('')}</div>`:''}`;
}
function renderDiscount(){
  document.getElementById('udDiscount').innerHTML=`
    <div class="udetail-discount-card${ucatSel.discountMethod==='pubSupport'?' on':''}" onclick="pickDiscount('pubSupport')">
      <span class="udetail-discount-check">✓</span><p class="udetail-discount-name">공시지원금</p><p class="udetail-discount-desc">기기값 할인, 요금제 정상가</p>
    </div>
    <div class="udetail-discount-card${ucatSel.discountMethod==='commitment'?' on':''}" onclick="pickDiscount('commitment')">
      <span class="udetail-discount-check">✓</span><p class="udetail-discount-name">선택약정</p><p class="udetail-discount-desc">요금제 25% 할인, 기기값 정상가</p>
    </div>`;
}
window.pickColor=function(i){ucatSel.color=i;renderColors();refreshImg();};
window.pickStorage=function(i){ucatSel.storage=i;renderStorage();refreshPrice();};
window.pickCarrier=function(n){ucatSel.carrier=n;renderCarrier();refreshPrice();};
window.togglePlanList=function(){ucatSel.planListOpen=!ucatSel.planListOpen;renderPlanRow();};
window.pickPlan=function(i){ucatSel.plan=ucatPlans[i];ucatSel.planListOpen=false;renderPlanRow();refreshPrice();};
window.pickDiscount=function(m){ucatSel.discountMethod=m;renderDiscount();refreshPrice();};

function refreshImg(){
  const c=ucatSel.device.colors&&ucatSel.device.colors[ucatSel.color];
  const src=(c&&c.img)||ucatSel.device.img||'';
  document.getElementById('udImg').innerHTML=src?`<img src="${src}" alt="${ucatSel.device.name}">`:'';
}
const UD_INSTALLMENT_RATE=1.0626; // 24개월 할부 결제시 할부이자 배율
function refreshPrice(){
  const d=ucatSel.device;
  const st=d.storageList[ucatSel.storage||0];
  const jointype=ucatSel.carrier==='LG U+'?'기기변경':'번호이동';
  const planObj=ucatSel.plan||ucatPlans[0];
  const q=ucatQuote({...d,storageList:[st]},ucatSel.carrier,jointype,planObj);
  const monthlyFeeFull=planObj?planObj.monthlyPrice:0;
  let monthlyFee,monthlyDev,subReady=true,principal;
  const subsidyWrap=document.getElementById('udSubsidyWrap');
  if(ucatSel.discountMethod==='commitment'){
    monthlyFee=Math.round(monthlyFeeFull*0.75);
    principal=st.price;
    subsidyWrap.style.display='none';
  } else {
    if(!q){ subReady=false; monthlyFee=monthlyFeeFull; principal=st.price; subsidyWrap.style.display='none'; }
    else {
      monthlyFee=monthlyFeeFull; principal=q.final;
      subsidyWrap.style.display='block';
      document.getElementById('udbListPrice').textContent=st.price.toLocaleString()+'원';
      document.getElementById('udbPubAmt').textContent='-'+q.pub.toLocaleString()+'원';
      document.getElementById('udbExtraAmt').textContent='-'+q.extra.toLocaleString()+'원';
      document.getElementById('udbPrincipal').textContent=q.final.toLocaleString()+'원';
    }
  }
  monthlyDev=Math.round(principal*UD_INSTALLMENT_RATE/24);
  const feeOrigEl=document.getElementById('udbFeeOrig');
  if(ucatSel.discountMethod==='commitment'){
    feeOrigEl.style.display='inline';
    feeOrigEl.textContent=monthlyFeeFull.toLocaleString()+'원(25%↓)';
  } else {
    feeOrigEl.style.display='none';
  }
  document.getElementById('udbFee').textContent=monthlyFee.toLocaleString()+'원';
  document.getElementById('udbDev').textContent=monthlyDev.toLocaleString()+'원';
  document.getElementById('udHeroAmt').innerHTML=(monthlyFee+monthlyDev).toLocaleString()+'<span>원</span>';
  document.getElementById('udHeroSub').textContent=(planObj?planObj.name:'-')+' / 24개월 기준'+(subReady?'':' · 공시지원금 정책 준비중(할부원금 기준)');
}
window.ctaGo=function(){
  // 예약/상담 신청은 galaxy_z8의 신청폼으로 이동 (기기명 쿼리로 전달, 거기서 자동 오픈)
  window.location.href='/galaxy_z8?openReserve='+encodeURIComponent(ucatSel.device.name);
};

async function loadFirebaseAndRender(){
  renderPage(); // Z8은 즉시 렌더 가능
  try{
    const [ds,ps,pols]=await Promise.all([
      fetch(UCAT_DB_URL+'/devices.json').then(r=>r.json()).catch(()=>null),
      fetch(UCAT_DB_URL+'/plans.json').then(r=>r.json()).catch(()=>null),
      fetch(UCAT_DB_URL+'/policy2.json').then(r=>r.json()).catch(()=>null)
    ]);
    const fbDevices=ds?Object.entries(ds).map(([id,v])=>({id,...v})).filter(d=>d.visible!==false):UCAT_MDEV_FALLBACK;
    const fbPolicies=pols?Object.entries(pols).map(([id,v])=>({id,...v})).filter(p=>p.visible!==false):[];
    if(ps){ const arr=Object.entries(ps).map(([id,v])=>({id,...v})).filter(p=>p.visible!==false); if(arr.length) ucatPlans=arr; }
    ucatDevices=[...UCAT_Z8_DEVICES,...fbDevices];
    ucatPolicies=[...UCAT_Z8_POLICIES,...fbPolicies];
  }catch(e){
    ucatDevices=[...UCAT_Z8_DEVICES,...UCAT_MDEV_FALLBACK];
  }
  renderPage(); // Firebase 데이터로 재렌더 (S/아이폰 등 비Z8 기기 정확한 표시 위해)
}
loadFirebaseAndRender();
</script>
