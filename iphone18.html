<script>
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.isIntersecting){ e.target.classList.add('in-view'); }
    });
  },{ threshold:.2 });
  document.querySelectorAll('.section, .benefits, .b-group').forEach(s=>io.observe(s));

  function wireCta(btnId, noteId){
    const btn = document.getElementById(btnId);
    const note = document.getElementById(noteId);
    if(!btn || !note) return;
    let t;
    btn.addEventListener('click', ()=>{
      note.classList.add('show');
      clearTimeout(t);
      t = setTimeout(()=>note.classList.remove('show'), 2200);
    });
  }
  wireCta('ctaBtn','ctaNote');
  wireCta('ctaBtn2','ctaNote2');
</script>

  return '<svg viewBox="0 0 24 24" width="'+s+'" height="'+s+'" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'+(SHI[name]||'')+'</svg>';
}

window.openShModal=function(i){
  var c=SH_ITEMS[i];
  if(!c) return;
  document.getElementById('shModalImg').innerHTML='<img src="'+c.img+'" alt="'+c.title+'">';
  document.getElementById('shModalBadge').textContent=c.badge;
  document.getElementById('shModalTitle').textContent=c.title;
  document.getElementById('shModalDesc').innerHTML=c.desc;
  document.getElementById('shModalFeatures').innerHTML=c.features.map(function(f){
    return '<div class="sh-feature-row"><span class="sh-feature-icon">'+shSvg(f.icon,18)+'</span><div><div class="sh-feature-title">'+f.title+'</div><div class="sh-feature-sub">'+f.sub+'</div></div></div>';
  }).join('');
  document.getElementById('shModalOverlay').classList.add('open');
  document.body.style.overflow='hidden';
};
window.closeShModal=function(){
  document.getElementById('shModalOverlay').classList.remove('open');
  document.body.style.overflow='';
};
