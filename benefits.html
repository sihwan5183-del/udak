<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>스마트홈 5종 — 유플러스 다이렉트</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Pretendard Variable','Pretendard',-apple-system,sans-serif;background:#fff;color:#111;-webkit-tap-highlight-color:transparent;}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;}

.btopbar{position:sticky;top:0;background:#fff;border-bottom:1px solid #f0f0f0;padding:16px 20px;display:flex;align-items:center;gap:10px;z-index:10;}
.btopbar-back{display:flex;align-items:center;gap:6px;font-size:14px;color:#666;font-weight:600;}

.sh-wrap{max-width:560px;margin:0 auto;padding:28px 20px 56px;}

.sh-badge-row{display:flex;justify-content:center;}
.sh-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(233,30,140,.06);color:#E91E8C;font-size:12px;font-weight:700;padding:7px 14px;border-radius:100px;margin-bottom:16px;}
.sh-title{font-size:21px;font-weight:800;color:#1A1A1A;letter-spacing:-.02em;line-height:1.45;text-align:center;margin-bottom:8px;word-break:keep-all;}
.sh-title-pink{color:#E91E8C;}
.sh-sub{font-size:13.5px;color:#888;text-align:center;margin-bottom:22px;}

.sh-summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:24px;}
.sh-summary-card{border:1.5px solid #ececec;border-radius:14px;padding:14px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;}
.sh-summary-icon{width:30px;height:30px;border-radius:50%;background:rgba(233,30,140,.06);display:flex;align-items:center;justify-content:center;color:#E91E8C;}
.sh-summary-text{font-size:11px;color:#666;line-height:1.5;}
.sh-summary-text b{display:block;font-size:12px;color:#1A1A1A;font-weight:800;}

.sh-tabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.sh-tabs::-webkit-scrollbar{display:none;}
.sh-tab{flex:1;min-width:62px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border:1.5px solid #ececec;border-radius:14px;cursor:pointer;background:#fff;transition:border-color .15s,background .15s;}
.sh-tab.on{border-color:#E91E8C;background:rgba(233,30,140,.05);}
.sh-tab-icon{width:24px;height:24px;display:flex;align-items:center;justify-content:center;color:#999;}
.sh-tab.on .sh-tab-icon{color:#E91E8C;}
.sh-tab-sub{font-size:9px;color:#999;font-weight:600;white-space:nowrap;}
.sh-tab.on .sh-tab-sub{color:#E91E8C;}
.sh-tab-name{font-size:11px;font-weight:800;color:#1A1A1A;white-space:nowrap;}
.sh-tab.on .sh-tab-name{color:#E91E8C;}

.sh-slide-viewport{overflow:hidden;border:1px solid #ececec;border-radius:20px;margin-bottom:12px;}
.sh-slide-track{display:flex;transition:transform .4s cubic-bezier(.4,0,.2,1);}
.sh-slide{flex:0 0 100%;padding:24px 20px;min-width:0;}
.sh-slide-badge{display:inline-block;background:rgba(233,30,140,.06);color:#E91E8C;font-size:11px;font-weight:700;padding:5px 12px;border-radius:100px;margin-bottom:10px;}
.sh-slide-title{font-size:23px;font-weight:800;color:#1A1A1A;letter-spacing:-.02em;margin-bottom:10px;}
.sh-slide-desc{font-size:13.5px;color:#666;line-height:1.7;margin-bottom:20px;}
.sh-slide-img{width:100%;aspect-ratio:4/3;border-radius:16px;background:rgba(233,30,140,.04);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#E91E8C;margin-bottom:16px;overflow:hidden;}
.sh-slide-img span{font-size:12px;color:#c9c9c9;font-weight:600;}
.sh-slide-img-real{background:#fafafa;padding:0;aspect-ratio:auto;height:auto;display:block;position:relative;cursor:pointer;}
.sh-slide-img-real img{width:100%;height:auto;display:block;}
.sh-slide-img-zoom{position:absolute;bottom:12px;right:12px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;color:#fff;pointer-events:none;}
.sh-feature-row{display:flex;align-items:flex-start;gap:12px;padding:10px 0;}
.sh-feature-icon{width:38px;height:38px;border-radius:50%;background:rgba(233,30,140,.06);display:flex;align-items:center;justify-content:center;color:#E91E8C;flex-shrink:0;}
.sh-feature-title{font-size:13.5px;font-weight:700;color:#1A1A1A;}
.sh-feature-sub{font-size:11.5px;color:#999;margin-top:2px;}
.sh-slide-empty{text-align:center;padding:44px 0;color:#bbb;font-size:13px;display:flex;flex-direction:column;align-items:center;}

.sh-dots{display:flex;justify-content:center;gap:7px;margin-bottom:24px;}
.sh-dot{width:7px;height:7px;border-radius:50%;background:#ececec;cursor:pointer;transition:all .25s;border:none;padding:0;}
.sh-dot.on{background:#E91E8C;width:20px;border-radius:5px;}

.sh-info-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:22px;}
.sh-info-card{border:1.5px solid #ececec;border-radius:14px;padding:12px 5px;text-align:center;}
.sh-info-card.hi{border-color:#E91E8C;background:rgba(233,30,140,.04);}
.sh-info-num{display:inline-block;width:18px;height:18px;line-height:18px;border-radius:50%;background:#1A1A1A;color:#fff;font-size:9px;font-weight:800;margin-bottom:8px;}
.sh-info-card.hi .sh-info-num{background:#E91E8C;}
.sh-info-icon{width:22px;height:22px;margin:0 auto 8px;color:#666;}
.sh-info-card.hi .sh-info-icon{color:#E91E8C;}
.sh-info-title{font-size:10px;font-weight:800;color:#1A1A1A;line-height:1.4;margin-bottom:4px;word-break:keep-all;}
.sh-info-sub{font-size:8.5px;color:#999;line-height:1.4;word-break:keep-all;}

.sh-cta{display:block;width:100%;padding:17px;background:#E91E8C;border:none;border-radius:100px;color:#fff;font-size:16px;font-weight:800;cursor:pointer;margin-bottom:16px;}
.sh-cta:active{background:#d4197e;}

.sh-detail-link{display:block;width:100%;text-align:center;padding:13px;margin-bottom:16px;background:#fff;border:1.5px solid #ececec;border-radius:100px;color:#666;font-size:13.5px;font-weight:700;cursor:pointer;}
.sh-detail-link:active{background:#fafafa;}

.sh-img-zoom-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:4000;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;cursor:zoom-out;}
.sh-img-zoom-overlay.open{display:flex;}
.sh-img-zoom-overlay img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;cursor:default;}
.sh-img-zoom-close{position:absolute;top:20px;right:20px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:22px;cursor:pointer;line-height:1;z-index:1;}

.sh-detail-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:3000;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;}
.sh-detail-overlay.open{display:flex;}
.sh-detail-modal{position:relative;width:100%;max-width:460px;max-height:86vh;overflow-y:auto;background:#fff;border-radius:24px;padding:30px 22px 24px;box-sizing:border-box;animation:shModalIn .3s cubic-bezier(.22,1,.36,1);}
@keyframes shModalIn{from{transform:scale(.94) translateY(16px);opacity:0;}to{transform:scale(1) translateY(0);opacity:1;}}
.sh-detail-close{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;background:#f3f4f6;border:none;color:#666;font-size:18px;cursor:pointer;line-height:1;}
.sh-detail-modal-img{width:100%;aspect-ratio:auto;height:auto;border-radius:16px;background:#fafafa;overflow:hidden;margin-bottom:16px;color:#E91E8C;text-align:center;}
.sh-detail-modal-img img{width:100%;height:auto;display:block;}
.sh-detail-modal-badge{display:inline-block;background:rgba(233,30,140,.06);color:#E91E8C;font-size:11px;font-weight:700;padding:5px 12px;border-radius:100px;margin-bottom:10px;}
.sh-detail-modal-title{font-size:22px;font-weight:800;color:#1A1A1A;margin-bottom:10px;}
.sh-detail-modal-desc{font-size:13.5px;color:#666;line-height:1.7;margin-bottom:18px;}
.sh-detail-modal-cta{display:block;width:100%;padding:16px;background:#E91E8C;border:none;border-radius:100px;color:#fff;font-size:15px;font-weight:800;cursor:pointer;margin-top:4px;}

.sh-disclaimer{font-size:10.5px;color:#aaa;line-height:1.9;}

@media(min-width:600px){ .sh-slide{padding:32px 36px;} }
</style>
</head>

    features:[
      {icon:'hub', title:'스마트홈 허브 연결', sub:'여러 기기를 하나로 연결해 관리'},
      {icon:'clock', title:'생활 알림 · 알람', sub:'가족 일정과 알림을 안내'},
      {icon:'mic', title:'간편한 음성 제어', sub:'말 한마디로 우리집 기기 제어'}
    ],
    ready:true
  },
  {
    id:'kids', tabIcon:'baby', tabSub:'아이 돌봄', tabName:'Kids',
    badge:'아이 돌봄', title:'우리집돌봄이 Kids',
    desc:'아이가 있는 공간을<br>언제 어디서든 실시간으로 확인하세요.',
    img:'https://raw.githubusercontent.com/sihwan5183-del/udak/main/assets/sh-kids-v2.png', modalImg:'https://raw.githubusercontent.com/sihwan5183-del/udak/main/assets/sh-kids.png',
    features:[
      {icon:'eye', title:'실시간 영상 확인', sub:'외출 중에도 스마트폰으로 확인'},
      {icon:'call', title:'양방향 음성 통화', sub:'카메라로 아이와 바로 대화'},
      {icon:'bell', title:'움직임 · 소리 감지 알림', sub:'특이 상황 발생 시 알림으로 안내'}
    ],
    ready:true
  },
  {
    id:'pet', tabIcon:'paw', tabSub:'반려동물 케어', tabName:'Pet',
    badge:'반려동물 케어', title:'우리집돌봄이 Pet',
    desc:'혼자 있는 반려동물도<br>더 안전하고 즐겁게 돌봐주세요.',
    img:'https://raw.githubusercontent.com/sihwan5183-del/udak/main/assets/sh-pet-v2.png', modalImg:'https://raw.githubusercontent.com/sihwan5183-del/udak/main/assets/sh-pet.png',
    features:[
      {icon:'bowl', title:'자동 급식 · 급수', sub:'정해진 시간에 사료·물 자동 공급'},
      {icon:'ball', title:'자동 놀이 기능', sub:'혼자 있을 때도 장난감으로 놀이'},
      {icon:'eye', title:'반려동물 상태 확인', sub:'카메라로 실시간 모습 확인'}
    ],
    ready:true
  }
];
let shState={active:0};

function shRenderTabs(){
  document.getElementById('shTabs').innerHTML=SH_CATEGORIES.map((c,i)=>
    '<div class="sh-tab'+(i===shState.active?' on':'')+'" onclick="shSelect('+i+')">'+
      '<span class="sh-tab-icon">'+shSvg(c.tabIcon,22)+'</span>'+
      '<span class="sh-tab-sub">'+c.tabSub+'</span>'+
      '<span class="sh-tab-name">'+c.tabName+'</span>'+
    '</div>'
  ).join('');
}

function shRenderSlides(){
  const track=document.getElementById('shSlideTrack');
  track.innerHTML=SH_CATEGORIES.map(function(c){
    if(!c.ready){
      return '<div class="sh-slide"><div class="sh-slide-empty">'+shSvg(c.tabIcon,40)+'<div style="margin-top:12px;">'+c.tabName+' 혜택 준비중입니다</div></div></div>';
    }
    var featuresHtml=c.features.map(function(f){
      return '<div class="sh-feature-row"><span class="sh-feature-icon">'+shSvg(f.icon,18)+'</span><div><div class="sh-feature-title">'+f.title+'</div><div class="sh-feature-sub">'+f.sub+'</div></div></div>';
    }).join('');
    return '<div class="sh-slide">'+
      '<span class="sh-slide-badge">'+c.badge+'</span>'+
      '<p class="sh-slide-title">'+c.title+'</p>'+
      '<p class="sh-slide-desc">'+c.desc+'</p>'+
      (c.img
        ? '<div class="sh-slide-img sh-slide-img-real" onclick="shOpenImageZoom()"><img src="'+c.img+'" alt="'+c.title+'"><span class="sh-slide-img-zoom">'+shSvg('zoom',16)+'</span></div>'
        : '<div class="sh-slide-img">'+shSvg(c.tabIcon,52)+'<span>상품 이미지 준비중</span></div>'
      )+
      featuresHtml+
    '</div>';
  }).join('');
  track.style.transform='translateX(-'+(shState.active*100)+'%)';
}

function shRenderDots(){
  document.getElementById('shDots').innerHTML=SH_CATEGORIES.map(function(c,i){
    return '<button type="button" class="sh-dot'+(i===shState.active?' on':'')+'" onclick="shSelect('+i+')" aria-label="'+c.tabName+'"></button>';
  }).join('');
}

function shRenderInfoCards(){
  var cur=SH_CATEGORIES[shState.active];
  document.getElementById('shInfoGrid').innerHTML=
    '<div class="sh-info-card"><span class="sh-info-num">01</span><div class="sh-info-icon">'+shSvg('percent',22)+'</div><div class="sh-info-title">이용료<br>전액 지원</div></div>'+
    '<div class="sh-info-card"><span class="sh-info-num">02</span><div class="sh-info-icon">'+shSvg('calendar',22)+'</div><div class="sh-info-title">36개월 약정 이용 시<br>'+cur.tabName+' 이용료 전액 지원</div></div>'+
    '<div class="sh-info-card"><span class="sh-info-num">03</span><div class="sh-info-icon">'+shSvg('warning',22)+'</div><div class="sh-info-title">중도 해지 시<br>위약금 발생</div><div class="sh-info-sub">'+cur.tabName+' 약정 기간 내 해지 시 위약금 발생 가능</div></div>'+
    '<div class="sh-info-card"><span class="sh-info-num">04</span><div class="sh-info-icon">'+shSvg('headset',22)+'</div><div class="sh-info-title">전문 설치 & A/S<br>안심 케어</div><div class="sh-info-sub">'+cur.tabName+' 전문 기사 설치, U+ A/S 지원</div></div>';
}

function shUpdateDetailBtn(){
  var cur=SH_CATEGORIES[shState.active];
  var btn=document.getElementById('shDetailBtn');
  if(btn) btn.style.display=cur.ready?'block':'none';
}

window.shOpenImageZoom=function(){
  var cur=SH_CATEGORIES[shState.active];
  if(!cur.img) return;
  document.getElementById('shImgZoomPic').src=cur.img;
  document.getElementById('shImgZoomPic').alt=cur.title;
  document.getElementById('shImgZoomOverlay').classList.add('open');
  document.body.style.overflow='hidden';
};
window.shCloseImageZoom=function(){
  document.getElementById('shImgZoomOverlay').classList.remove('open');
  document.body.style.overflow='';
};

window.shOpenDetail=function(){
  var cur=SH_CATEGORIES[shState.active];
  if(!cur.ready) return;
  document.getElementById('shDetailImg').innerHTML=cur.modalImg
    ? '<img src="'+cur.modalImg+'" alt="'+cur.title+'">'
    : '<div style="padding:40px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;">'+shSvg(cur.tabIcon,48)+'<span style="font-size:12px;color:#bbb;font-weight:600;">제품 사진 준비중</span></div>';
  document.getElementById('shDetailBadge').textContent=cur.badge;
  document.getElementById('shDetailTitle').textContent=cur.title;
  document.getElementById('shDetailDesc').innerHTML=cur.desc;
  document.getElementById('shDetailFeatures').innerHTML=cur.features.map(function(f){
    return '<div class="sh-feature-row"><span class="sh-feature-icon">'+shSvg(f.icon,18)+'</span><div><div class="sh-feature-title">'+f.title+'</div><div class="sh-feature-sub">'+f.sub+'</div></div></div>';
  }).join('');
  document.getElementById('shDetailOverlay').classList.add('open');
  document.body.style.overflow='hidden';
};
window.shCloseDetail=function(){
  document.getElementById('shDetailOverlay').classList.remove('open');
  document.body.style.overflow='';
};

window.shSelect=function(i){
  shState.active=i;
  shRenderTabs();
  document.getElementById('shSlideTrack').style.transform='translateX(-'+(i*100)+'%)';
  shRenderDots();
  shRenderInfoCards();
  shUpdateDetailBtn();
};

window.shGoReserve=function(){
  var cur=SH_CATEGORIES[shState.active];
  var onsiteQs=new URLSearchParams(location.search).get('onsite')==='1'?'&onsite=1':'';
  window.location.href='/galaxy_z8?smartHomeInterest='+encodeURIComponent(cur.title)+onsiteQs;
};

(function(){
  var viewport=document.querySelector('.sh-slide-viewport');
  var tx=0;
  viewport.addEventListener('touchstart',function(e){ tx=e.changedTouches[0].clientX; },{passive:true});
  viewport.addEventListener('touchend',function(e){
    var dx=e.changedTouches[0].clientX-tx;
    if(Math.abs(dx)>=40){
      var next=shState.active+(dx<0?1:-1);
      next=Math.max(0,Math.min(SH_CATEGORIES.length-1,next));
      if(next!==shState.active) shSelect(next);
    }
  },{passive:true});
})();

shRenderTabs();
shRenderSlides();
shRenderDots();
shRenderInfoCards();
shUpdateDetailBtn();
</script>

</body></html>
