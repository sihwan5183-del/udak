<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>스토어 관리자 — 유플러스 다이렉트</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/assets/store/store.css?v=20261016b">
<script>window.STORE_CFG = {mode:'edit'};</script>
</head>
<body>
<!-- 관리자 로그인 (기존 유닥 어드민과 같은 비밀번호) -->
<div class="login" id="login">
  <form class="bx" id="loginForm">
    <h2>스토어 관리자</h2>
    <p>갤럭시(고객 화면)와 연동된 편집 화면입니다.</p>
    <input type="password" id="pw" placeholder="비밀번호" autocomplete="current-password">
    <div class="err" id="loginErr"></div>
    <button class="cta" type="submit">로그인</button>
  </form>
</div>
<div id="storeRoot"></div>
<script>
(function(){
  var HASH='4a04cb91d8820593cd940bbfb04120a71ea79b52ff250cf27fd47df555c0aece';
  function boot(){
    document.getElementById('login').remove();
    var a=document.createElement('script'); a.src='/assets/store/store.js?v=20261016b';
    a.onload=function(){ var b=document.createElement('script'); b.src='/assets/store/store-admin.js?v=20261016b';
      b.onload=function(){ var c=document.createElement('script'); c.src='/assets/store/store-price.js?v=20261016b'; document.body.appendChild(c); };
      document.body.appendChild(b); };
    document.body.appendChild(a);
  }
  function sha(s){ return crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)).then(function(b){ return Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2)}).join(''); }); }
  try{ if(sessionStorage.getItem('st_admin')===HASH){ boot(); return; } }catch(e){}
  document.getElementById('loginForm').addEventListener('submit',function(e){
    e.preventDefault();
    sha(document.getElementById('pw').value).then(function(h){
      if(h===HASH){ try{ sessionStorage.setItem('st_admin',HASH); }catch(e){} boot(); }
      else document.getElementById('loginErr').textContent='비밀번호가 맞지 않아요.';
    });
  });
})();
</script>
</body>
</html>
