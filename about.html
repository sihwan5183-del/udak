<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>왜 유플러스 다이렉트인가요? — 유플러스 다이렉트</title>
<meta name="description" content="LG U+ 공식 파트너사 신세계정보통신이 운영하는 유플러스 다이렉트를 소개합니다.">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Pretendard Variable','Pretendard',-apple-system,sans-serif;background:#e9e9ec;color:#111;-webkit-tap-highlight-color:transparent;}
a{text-decoration:none;color:inherit;}

.apagewrap{max-width:480px;margin:0 auto;background:#fff;min-height:100vh;box-shadow:0 0 40px rgba(0,0,0,.06);}

.atopbar{position:sticky;top:0;background:#fff;border-bottom:1px solid #f0f0f0;padding:16px 20px;display:flex;align-items:center;gap:10px;z-index:10;}
.atopbar-back{display:flex;align-items:center;gap:6px;font-size:14px;color:#666;font-weight:600;}

.ahero{padding:52px 24px 44px;text-align:center;background:#fff;}
.ahero-certimg{width:172px;height:172px;display:block;margin:0 auto 22px;border-radius:50%;}
.ahero-label{font-size:14px;font-weight:700;color:#E91E8C;letter-spacing:.02em;margin-bottom:8px;}
.ahero-title{font-size:28px;font-weight:800;letter-spacing:-.02em;color:#1A1A1A;}

.acard{background:#fff;border:1px solid #ececec;border-radius:18px;margin:20px 20px 0;padding:26px 20px;}
.acard-eyebrow{font-size:12px;font-weight:800;color:#E91E8C;letter-spacing:.06em;margin-bottom:8px;text-align:center;}
.acard-title{font-size:18px;font-weight:800;color:#1A1A1A;text-align:center;margin-bottom:20px;line-height:1.4;}

.abiz{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;font-size:13.5px;padding:20px 4px 4px;border-top:1px solid #f2f2f2;margin-top:20px;}
.abiz dt{color:#999;font-weight:700;}
.abiz dd{color:#1A1A1A;font-weight:600;}

.aimgblock{width:100%;display:block;margin:20px auto 0;}

.abottom-cta{padding:40px 24px 52px;text-align:center;}
.abottom-cta-title{font-size:18px;font-weight:800;color:#1A1A1A;margin-bottom:18px;line-height:1.5;}
.abottom-cta-btn{display:inline-block;padding:15px 38px;background:#E91E8C;color:#fff;border-radius:14px;font-size:15.5px;font-weight:800;}
</style>
</head>
<body>

<div class="apagewrap">

<div class="atopbar">
  <a class="atopbar-back" href="/galaxy_z8">‹ 돌아가기</a>
</div>

<div class="ahero">
    <img class="ahero-certimg" src="https://raw.githubusercontent.com/sihwan5183-del/udak/main/assets/about-official-badge.jpg" alt="LG유플러스 공식인증대리점 (주)신세계정보통신">
    <p class="ahero-label">유플러스 공식파트너사</p>
    <p class="ahero-title">유플러스 다이렉트</p>
</div>


  <div class="acard">
    <p class="acard-eyebrow">ABOUT US</p>
    <p class="acard-title">유플러스 다이렉트는<br>신세계정보통신이 운영하는<br>온라인 상담 채널입니다</p>
    <dl class="abiz">
      <dt>운영사</dt><dd>신세계정보통신</dd>
      <dt>파트너십</dt><dd>LG U+ 공식 파트너사</dd>
      <dt>직영매장</dt><dd>서울·경기 30개 운영</dd>
      <dt>서비스</dt><dd>온라인 상담 · 개통 · 사후관리 일괄 진행</dd>
    </dl>
  </div>

  <div style="padding:0 20px;">
    <img class="aimgblock" src="https://raw.githubusercontent.com/sihwan5183-del/udak/main/assets/about-stores.png" alt="유플러스 다이렉트란? 서울·경기 직영매장 30개 운영">
  </div>

  <div style="padding:0 20px;">
    <img class="aimgblock" src="https://raw.githubusercontent.com/sihwan5183-del/udak/main/assets/about-fast.png" alt="서울·경기 1위, 빠르게 받아보실 수 있습니다">
  </div>

  <div style="padding:0 20px;">
    <img class="aimgblock" src="https://raw.githubusercontent.com/sihwan5183-del/udak/main/assets/about-directcare.png" alt="U+ DIRECT CARE, 개통으로 끝내지 않습니다">
  </div>

  <div style="padding:0 20px;">
    <img class="aimgblock" src="https://raw.githubusercontent.com/sihwan5183-del/udak/main/assets/about-whyudak.png" alt="왜 유닭인가요">
  </div>

  <div style="padding:0 20px;">
    <img class="aimgblock" src="https://raw.githubusercontent.com/sihwan5183-del/udak/main/assets/about-purchase-steps.png" alt="온라인 구매 절차, 이렇게 진행됩니다">
  </div>

  <div class="abottom-cta">
    <p class="abottom-cta-title">지금 유닥에서<br>스마트폰 가격을 확인해보세요</p>
    <a class="abottom-cta-btn" href="/galaxy_z8">상품 보러가기</a>
  </div>

</div>

</body></html>
