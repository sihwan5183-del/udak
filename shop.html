<script>
// 신청은 ssgadmin 영업관리 > 유닥 시트(reservations_udak)로 저장 — 광고 utm 을 이 탭 세션에 보관 (galaxy_z8.html 과 같음)
var UDAK_UTM = {};
(function(){
  try {
    var q = new URLSearchParams(location.search), keys = ['utm_source','utm_medium','utm_campaign','utm_content','utm_term'], got = {}, has = false;
    keys.forEach(function(k){ var v = q.get(k); if (v) { got[k] = v; has = true; } });
    if (has) { UDAK_UTM = got; sessionStorage.setItem('udak_utm', JSON.stringify(got)); }
    else { UDAK_UTM = JSON.parse(sessionStorage.getItem('udak_utm') || '{}') || {}; }
  } catch(e) { UDAK_UTM = {}; }
})();
var PAGE_UTM_CAMPAIGN = UDAK_UTM.utm_campaign || null;
// 유닥 시트 채널값 (메타/네이버/SNS/세그/기타). utm 없으면 메타광고 랜딩 기준 '메타'
var PAGE_CHANNEL = (function(){
  var s = String(UDAK_UTM.utm_source || '').toLowerCase();
  if (!s || /^(fb|facebook|ig|instagram|meta|an|msg|messenger|audience_network)$/.test(s)) return '메타';
  if (s.indexOf('naver') > -1) return '네이버';
  if (/^(x|twitter|threads|kakao|youtube|tiktok|blog|band|sns)$/.test(s)) return 'SNS';
  if (/(seg|sms|lms|mms)/.test(s)) return '세그';
  return '기타';
})();
// 메타 '메이드' 신호용 클릭 정보 (전화번호 등 개인정보는 메타로 보내지 않음)
(function(){try{var q=new URLSearchParams(location.search).get('fbclid');if(q){sessionStorage.setItem('udak_fbclid',q);sessionStorage.setItem('udak_fbclid_ts',String(Date.now()));}}catch(e){}})();
function udakMetaIds(){
  try{
    var ck=function(n){var m=document.cookie.match(new RegExp('(?:^|;\\s*)'+n+'=([^;]*)'));return m?decodeURIComponent(m[1]):null;};
    var fbc=ck('_fbc'), fbp=ck('_fbp');
    if(!fbc){var id=sessionStorage.getItem('udak_fbclid');if(id)fbc='fb.1.'+(sessionStorage.getItem('udak_fbclid_ts')||Date.now())+'.'+id;}
    return {meta_fbc:fbc||null, meta_fbp:fbp||null, meta_ua:(navigator.userAgent||'').slice(0,400)||null, meta_page_url:(location.origin+location.pathname+location.search).slice(0,500)};
  }catch(e){return {};}
}
// srcTag: 이 페이지에서 들어온 신청은 유닥 시트 '신청 경로'에 ' · /shop' 이 붙음 (예: 온라인 상담 신청 · /shop)

</script>
